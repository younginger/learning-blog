site_name: younginger 的摸鱼手册
site_url: https://younginger.github.io/learning-blog/
repo_url: https://github.com/younginger/learning-blog
repo_name: GitHub

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs        # 顶部导航栏
    - navigation.sections    # 侧边栏分组
    - toc.integrate          # 目录集成在侧边栏
    - content.code.copy      # 代码复制按钮
  # 🎨 视觉配色：添加深色模式切换按钮
  palette: 
    - scheme: default
      primary: teal          # 主题色：青色
      accent: purple         # 强调色：紫色
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate          # 深色模式
      primary: teal
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# 🗺️ 导航结构（这是新增的核心部分）
nav:
  - 首页: index.md
  - 学习笔记:
      - 扩散模型: diffusion-study.md
      - 医学图像: medical-ai.md  # 占位，稍后创建
  - 生活瞬间:                    # <--- 新增的分区
      - 热爱当下: photography.md
      - 第九艺术: hobbies.md
  - 关于我: about.md             # 占位，稍后创建

# 插件配置（保持不变）
markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
plugins:
  - search    # 开启搜索功能
  - glightbox # 开启图片灯箱效果
extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js